<!DOCTYPE html>
<html lang="en">
<head>

  <title>My dogs, Federico Salerno</title>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#111111;
      --panel:#181818;
      --line:#2a2a2a;
      --line-hover:#3d3d3d;
      --text:#ededed;
      --muted:#9a9a9a;

      /* with no hue in the palette the accent is only a light grey: it marks a rule,
         a dot or a number, never a colour */
      --accent:#c4c4c4;
      /* One single soft light grey fill for every band and button, near black ink on it,
         contrast 11.4:1, the same pair as the rows of the home. Not pure white: a white
         slab glares on a dark page, #d4d4d4 sits quietly and still reads as filled. */
      --btn:#d4d4d4;
      --on-btn:#141414;
      --btn-line:rgba(20,20,20,0.10);
      /* the hovered band brightens one step, the ink stays dark, contrast 16.0:1, and the
         press deepens it; one duration drives fill and ink everywhere */
      --btn-sel:#ebebeb;
      --on-btn-sel:#141414;
      --btn-press:#bfbfbf;
      --row-ease:.12s ease;
      --btn-hover:#ebebeb;
      --btn-line-hover:rgba(20,20,20,0.16);

      --ff:'IBM Plex Sans',system-ui,-apple-system,sans-serif;

      --s1:8px; --s2:16px; --s3:24px; --s4:32px;
      --s5:48px; --s6:64px; --s7:96px; --s8:128px;

      /* three type steps only */
      --fs-s:0.8125rem;
      --fs-m:1rem;
      --fs-l:1.375rem;
      /* Rows and buttons carry the main navigation of the site, so their text is never
         smaller than the running body copy: it is the body size itself, 16px. The old
         "one step below body" rule inverted the hierarchy and is gone; the bands are made
         slim by --row-h and by their padding, never by shrinking the type. */
      --fs-btn:1rem;

      /* the section mark: a short tick at the head of a block, the one separator of the
         site. Never a rule across the page. */
      --sep-w:24px;
      --sep-col:#3d3d3d;
      --radius:7px;
      /* A thing you press is fully rounded: every row, button and chip ends in two
         semicircles instead of corners, so the shape itself says "press me". --radius
         stays for the surfaces that HOLD something -- a photo, a panel, a long
         paragraph -- where a full round would bite into the content. */
      --pill:999px;
      /* the mark in the left margin of a band: a dot, sitting on the centre of the left
         cap, so band and mark share one centre and the dot grows without drifting */
      --dot:9px;
      --dot-hover:12px;
      --bar-col:#141414;
      /* air between two bands of an index */
      --row-gap:20px;
      /* bands: minimum height, vertical padding and line height of every row */
      --row-h:33px;
      --row-pad-y:3px;
      --row-lh:1.15;

      --measure:720px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{-webkit-text-size-adjust:100%}
    body{
      background:var(--bg);
      color:var(--text);
      font-family:var(--ff);
      font-size:16px;
      line-height:1.65;
      -webkit-font-smoothing:antialiased;
    }
    a{color:inherit}
    :focus-visible{outline:2px solid var(--text);outline-offset:3px}
    .skip{position:absolute;left:-9999px;top:0}
    .skip:focus{left:var(--s3);top:var(--s3);z-index:5;background:var(--bg);color:var(--text);padding:var(--s1) var(--s2);border-radius:var(--pill);text-decoration:none;outline:2px solid var(--accent)}

    .wrap{width:100%;max-width:var(--measure);margin:0 auto;padding:0 var(--s3)}

    /* the clicked row travels to the top of the page and stays as a slim bar */
    /* the clicked row travels to the top of the page and stays as a slim band */
    .bar{
      position:sticky;top:0;z-index:2;
      background:var(--btn);border-bottom:1px solid var(--btn-line);
      color:var(--on-btn);
    }
    .bar-inner{
      width:100%;max-width:var(--measure);margin:0 auto;
      min-height:var(--row-h);
      padding:var(--row-pad-y) var(--s2);
      display:flex;align-items:center;justify-content:space-between;gap:var(--s2);
      font-size:var(--fs-s);line-height:var(--row-lh);letter-spacing:0.12em;text-transform:uppercase;
    }
    .bar a{color:var(--on-btn);text-decoration:none;border-bottom:1px solid transparent;transition:border-color .18s ease}
    .bar a:hover{border-bottom-color:var(--on-btn)}
    .bar a:focus-visible{outline:2px solid var(--on-btn);outline-offset:3px}
    .bar-here{font-weight:500}

    .head{padding:var(--s7) 0 var(--s6)}
    h1{font-size:var(--fs-l);font-weight:600;letter-spacing:-0.02em;line-height:1.2}
    .lede{margin-top:var(--s2);font-size:var(--fs-m);color:var(--muted);max-width:60ch}

        /* Sections are separated by space and by their own opening type, never by a rule
       across the page: the eyebrow and the title already say a new block has started. */
    .block{padding:var(--s7) 0 0}
    .block:first-of-type{padding-top:var(--s5)}

    /* gallery: two squares per row at 720 px, one under 600 px */
    .gallery{
      list-style:none;
      display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s2);
    }
    .gallery li{
      aspect-ratio:1;overflow:hidden;
      background:var(--panel);border-radius:var(--radius);
    }
    .gallery img{
      display:block;width:100%;height:100%;object-fit:cover;border-radius:var(--radius);
    }

    /* Back is one row of the home index, full width at the foot of the page */
    .back{
      position:relative;
      display:flex;align-items:center;justify-content:center;text-align:center;
      width:100%;min-height:var(--row-h);margin-top:var(--s6);
      padding:var(--row-pad-y) var(--s3);
      background:var(--btn);border:1px solid var(--btn-line);border-radius:var(--pill);
      color:var(--on-btn);text-decoration:none;
      font-size:var(--fs-btn);font-weight:500;line-height:var(--row-lh);
      transition:background-color var(--row-ease);
    }
    /* the same dot as a row of the home, on the centre of the left cap: one mark for
       every band of the site, index row or full width button alike */
    .back::before{
      content:"";position:absolute;top:50%;
      left:calc((var(--row-h) - var(--dot)) / 2);
      transform:translateY(-50%);
      width:var(--dot);height:var(--dot);
      border-radius:50%;background:var(--bar-col);
      transition:width var(--row-ease),height var(--row-ease),left var(--row-ease);
    }
    /* the dot grows from its own centre: left follows the size, so it never drifts */
    .back:hover::before,.back:focus-visible::before{width:var(--dot-hover);height:var(--dot-hover);left:calc((var(--row-h) - var(--dot-hover)) / 2)}
    .back:hover,.back:focus-visible{background:var(--btn-sel)}
    .back:active{background:var(--btn-press)}
    /* hover deepens the fill, so the light ink keeps its contrast */

    /* the canonical section mark, identical on every page: .block, .foot-inner */
    .block::before,.foot-inner::before{
      content:"";display:block;
      width:var(--sep-w);height:1px;background:var(--sep-col);
      margin-bottom:var(--s3);
    }

    .foot{margin-top:var(--s7);padding-bottom:var(--s6)}
    .foot-inner{padding-top:var(--s4)}
    .contacts{
      list-style:none;display:flex;flex-wrap:wrap;gap:var(--s1) var(--s3);
      font-size:var(--fs-s);letter-spacing:0.04em;
    }
    .contacts a{
      color:var(--muted);text-decoration:none;border-bottom:1px solid transparent;padding-bottom:2px;
      transition:color .18s ease,border-color .18s ease;
    }
    .contacts a:hover{color:var(--text);border-bottom-color:var(--accent)}
    .copy{margin-top:var(--s2);font-size:var(--fs-s);color:#808080}

    @media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
    @media (max-width:600px){
      .head{padding:var(--s5) 0 var(--s4)}
      .block{padding:var(--s4) 0}
      .gallery{grid-template-columns:1fr;gap:var(--s1)}
      .back{margin-top:var(--s5)}
      .foot{margin-top:var(--s6)}
      .contacts{gap:var(--s1) var(--s2)}
    }
    /* ---- Selecting: the fill arrives from one side -----------------------------
       The hover was a swap -- the whole band went from --btn to --btn-sel in 120 ms, a
       flat blink with nothing in it to follow. Now the light enters on the side the bar
       is on and runs the length of the band, carrying a brighter crest at its front,
       and leaves the way it came out the far end, in half the time and on a drier curve:
       the rule the rest of the site already follows for entrances and exits. It takes
       620 ms, which is slow enough to be watched and short enough not to be waited for,
       and it travels to 170 per cent of the band, so the crest is past the right border
       by the end and what is left standing is a clean fill. It is one gradient painted
       on the element itself: no extra node, nothing laid out, nothing composited that
       was not already there.
       The scale of the hover goes: a band that fills has no need to grow as well, and on
       a band whose fill is a backdrop-filter the resampling of a 1.018 scale is the one
       thing that can flicker. The press keeps its own answer, a hair smaller and the
       darker fill at once, so a click is felt and not only seen.
       To go back: drop data-hover="wipe" from the <body> of this page and what is left
       is exactly the hover that was here before. */
    body[data-hover="wipe"]{
      --sel-in:.62s cubic-bezier(.16,1,.3,1);
      --sel-out:.34s cubic-bezier(.4,0,.2,1);
      /* the crest the fill carries at its front: --btn-sel is the fill, this is the
         lighter edge that runs ahead of it and is what makes the move legible */
      --sel-lead:#fbfbfb;
    }
    body[data-hover="wipe"] .row,
    body[data-hover="wipe"] .back,
    body[data-hover="wipe"] .pdf{
      background-image:linear-gradient(90deg,
        var(--btn-sel) 0 52%,var(--sel-lead) 72%,var(--btn-sel) 86%,transparent 100%);
      background-repeat:no-repeat;
      background-position:right center;
      background-size:0% 100%;
      transition:background-size var(--sel-out),color var(--row-ease),transform var(--row-ease),
                 -webkit-backdrop-filter var(--row-ease),backdrop-filter var(--row-ease);
    }
    body[data-hover="wipe"] .row:hover,
    body[data-hover="wipe"] .row:focus-visible,
    body[data-hover="wipe"] .back:hover,
    body[data-hover="wipe"] .back:focus-visible,
    body[data-hover="wipe"] .pdf:hover,
    body[data-hover="wipe"] .pdf:focus-visible{
      /* the colour underneath stays the resting one: the gradient is the only thing that
         moves, and a band already filled with --btn-sel would have nothing to show */
      background-color:var(--btn);
      background-position:left center;
      background-size:170% 100%;
      transform:none;
      transition:background-size var(--sel-in),color var(--row-ease),transform var(--row-ease);
    }
    body[data-hover="wipe"] .row::before{
      transition:width var(--sel-in),height var(--sel-in);
    }
    @supports ((backdrop-filter:invert(1)) or (-webkit-backdrop-filter:invert(1))){
      body[data-hover="wipe"] .row:hover,
      body[data-hover="wipe"] .row:focus-visible{
        background-color:color-mix(in srgb,var(--btn) var(--band-fill,62%),transparent);
        /* and the band no longer brightens as a whole: the one thing that says it is
           being chosen is the fill running across it */
        -webkit-backdrop-filter:invert(1) brightness(.891);
        backdrop-filter:invert(1) brightness(.891);
      }
    }
    body[data-hover="wipe"] .row:active,
    body[data-hover="wipe"] .back:active,
    body[data-hover="wipe"] .pdf:active{
      background-image:linear-gradient(var(--btn-press),var(--btn-press));
      background-size:100% 100%;
      transform:scale(.994);
      transition:none;
    }
    @media (prefers-reduced-motion:reduce){
      /* no travel, just the two states: the band is filled or it is not */
      body[data-hover="wipe"] .row,
      body[data-hover="wipe"] .back,
      body[data-hover="wipe"] .pdf{background-size:0% 100% !important}
      body[data-hover="wipe"] .row:hover,
      body[data-hover="wipe"] .row:focus-visible,
      body[data-hover="wipe"] .back:hover,
      body[data-hover="wipe"] .back:focus-visible,
      body[data-hover="wipe"] .pdf:hover,
      body[data-hover="wipe"] .pdf:focus-visible,
      body[data-hover="wipe"] .row:active,
      body[data-hover="wipe"] .back:active,
      body[data-hover="wipe"] .pdf:active{
        background-size:100% 100% !important;
        background-image:linear-gradient(var(--btn-sel),var(--btn-sel)) !important;
      }
      body[data-hover="wipe"] .row:active,
      body[data-hover="wipe"] .back:active,
      body[data-hover="wipe"] .pdf:active{transform:none !important}
    }
    /* ---- Selecting: the band is picked up off the sheet ------------------------
       The wipe was light crossing a band that never moved, and a band that never moves
       is a band nothing is happening to. So the enlargement is back and larger, and it
       is not the effect but the reason for it: the chosen band springs out from its own
       centre to --sel-grow, 13 px of new band at each end of a 672 px row against the 6
       the old 1.018 gave, passes 18 per cent beyond and settles once. While it goes, its
       fill opens: the colour-mix of --btn over the inverted backdrop goes to nothing, so
       the lattice runs through the chosen band at full strength instead of as a trace
       under 62 per cent. Opening it does not darken anything -- the band is the negative
       of its own backdrop, invert(1) brightness(.987) is still a light slab, and the ink
       keeps its contrast -- and the face the cursor is in is the one the canvas fills
       hard, so there is always something to see in there. That material is this site's
       own and no template has it. The mark in the left margin comes up 80 ms late, on a
       transform and not on its box, which is the only reason a change of size reads as
       mass and not as a zoom. Nothing new is painted: .row::after is still free.
       The cost, plainly: a scaled element scales its own backdrop too, so the sheet seen
       through the band is magnified by the same four per cent -- in register at the
       centre, out by some 13 px at either end. That is the parallax of a slab held above
       a surface, which is what the band now is; --sel-grow is where to spend less of it.
       On .back and .pdf the same rules give the same spring with the plain --btn to
       --btn-sel step they always had: those are opaque and have no sheet to show.
       To go back: set data-hover to "wipe" on the <body> for the travelling fill, or drop
       the attribute for the plain hover underneath. Both are still in this sheet. */
    body[data-hover="spring"]{
      --sel-grow:1.04;
      /* held just under the hover, never back near rest: a press that pulls the edge out
         from under the pointer can land its mouseup on the <li>, where the click never
         navigates. Four px of step is felt, and the fill going dark is the real answer */
      --sel-press:1.028;
--sel-spring:linear(
      0, 0.009 2%, 0.033 4%, 0.072 6%, 0.123 8%, 0.184 10%, 0.255 12%,
      0.333 14%, 0.415 16%, 0.502 18%, 0.590 20%, 0.678 22%, 0.765 24%,
      0.848 26%, 0.925 28%, 0.996 30%, 1.057 32%, 1.108 34%, 1.147 36%,
      1.171 38%, 1.180 41%, 1.168 44%, 1.138 48%, 1.098 52%, 1.054 56%,
      1.016 60%, 0.998 62%, 0.986 66%, 0.988 72%, 0.992 80%, 0.996 88%,
      0.999 94%, 1);
      /* the travel is over by about 300 ms and the rest is the settle. A pointer running
         down the list crosses a band every 120 ms or so, and a spring cut off in flight
         reads as broken in a way a wipe cut short never does, so it cannot be longer.
         The bezier is the fallback and is a working overshoot on its own, kept shorter
         because it creeps instead of landing. Out is the drier curve of the portrait and
         the quote card, in half the time: leaving is not an event. */
      --sel-in:.46s cubic-bezier(.34,1.32,.52,1);
      --sel-out:.26s cubic-bezier(.4,0,.2,1);
      /* the opening of the fill is kept off the spring: a value that overshoots is right
         for a size and wrong for a colour, which would leave the gamut on the way */
      --sel-light-in:.34s cubic-bezier(.2,0,0,1);
      --sel-light-out:.2s ease;
      --sel-bar:.3s var(--idx-ease,cubic-bezier(.22,1,.36,1));
      --sel-bar-lag:80ms;
      /* 5/3 and 74/56: --bar-w-hover over --bar-w, --bar-h-hover over --bar-h, as ratios,
         because the bar grows on a transform now. calc cannot divide by a length, so they
         are literals: change the bar in :root and these want changing with it. */
      --sel-bar-x:1.667;
      --sel-bar-y:1.321;
      --sel-press-t:.09s;
      /* the four knobs of the old hover pointed at this variant instead of fought with a
         heavier selector: the rules above keep what this block wants from them (the fill
         opening, the backdrop going to .987, the ink) and lose the geometry, which this
         block owns. The bar in particular stops growing on its box: a box resizing inside
         a backdrop-filter surface that is being scaled re-rasters that layer every frame,
         and it is the one combination here that would stutter. */
      --row-scale:1;
      --row-scale-press:1;
      --bar-w-hover:var(--bar-w,3px);
      --bar-h-hover:var(--bar-h,56%);
    }
    /* the hand damped curve only where linear() exists: a timing function the browser
       does not know, arriving through a var(), does not fall back -- it invalidates the
       whole transition and the move becomes a snap */
    @supports (transition-timing-function:linear(0,1)){
      body[data-hover="spring"]{--sel-in:.54s var(--sel-spring)}
    }
    /* the origin stays at the centre of the box, which is the initial value: anchored at
       one end the band would grow into the page instead of out of it */
    body[data-hover="spring"] .row,
    body[data-hover="spring"] .back,
    body[data-hover="spring"] .pdf{
      transition:transform var(--sel-out),
                 background-color var(--sel-light-out),color var(--sel-light-out),
                 -webkit-backdrop-filter var(--sel-light-out),
                 backdrop-filter var(--sel-light-out);
    }
    body[data-hover="spring"] .row:hover,
    body[data-hover="spring"] .row:focus-visible,
    body[data-hover="spring"] .back:hover,
    body[data-hover="spring"] .back:focus-visible,
    body[data-hover="spring"] .pdf:hover,
    body[data-hover="spring"] .pdf:focus-visible{
      /* only the geometry and the time the opening is given: not one colour is written
         here, so the band opens on the site's own hover rule, and nothing outranks the
         press */
      transform:scale(var(--sel-grow));
      transition:transform var(--sel-in),
                 background-color var(--sel-light-in),color var(--sel-light-in),
                 -webkit-backdrop-filter var(--sel-light-in),
                 backdrop-filter var(--sel-light-in);
    }
    /* the bar is inside the band, so the spring already carries it: what it adds is its
       own growth, late, on the curve of the entrances */
    body[data-hover="spring"] .row::before{transition:transform var(--sel-out)}
    body[data-hover="spring"] .row:hover::before,
    body[data-hover="spring"] .row:focus-visible::before{
      transform:translateY(-50%) scale(var(--sel-bar-x),var(--sel-bar-y));
      transition:transform var(--sel-bar) var(--sel-bar-lag);
    }
    /* a finger leaves :hover stuck on whatever it tapped, and at four per cent with the
       sheet running through it a band left chosen is unmistakable. On a touch pointer the
       light and the press stay and the geometry goes; the keyboard is deliberately not in
       here, which is why :focus-visible is left out */
    @media (hover:none){
      body[data-hover="spring"] .row:hover,
      body[data-hover="spring"] .back:hover,
      body[data-hover="spring"] .pdf:hover{transform:none}
      body[data-hover="spring"] .row:hover::before{transform:translateY(-50%)}
    }
    body[data-hover="spring"] .row:active,
    body[data-hover="spring"] .back:active,
    body[data-hover="spring"] .pdf:active{
      /* a press is not an animation, it is under the finger now: 90 ms and dry. Letting
         go hands the band back to the spring from wherever it had got to, so the release
         is the button pushing back */
      transform:scale(var(--sel-press));
      transition:transform var(--sel-press-t) cubic-bezier(.4,0,.2,1),
                 background-color var(--sel-press-t) linear,
                 color var(--sel-press-t) linear,
                 -webkit-backdrop-filter var(--sel-press-t) linear,
                 backdrop-filter var(--sel-press-t) linear;
    }
    @media (prefers-reduced-motion:reduce){
      /* the two states and nothing between them: the chosen band is the open one, the
         pressed band is the dark one, and the geometry of the column never changes */
      body[data-hover="spring"] .row,
      body[data-hover="spring"] .row:hover,
      body[data-hover="spring"] .row:focus-visible,
      body[data-hover="spring"] .row:active,
      body[data-hover="spring"] .back,
      body[data-hover="spring"] .back:hover,
      body[data-hover="spring"] .back:focus-visible,
      body[data-hover="spring"] .back:active,
      body[data-hover="spring"] .pdf,
      body[data-hover="spring"] .pdf:hover,
      body[data-hover="spring"] .pdf:focus-visible,
      body[data-hover="spring"] .pdf:active{transform:none !important}
      body[data-hover="spring"] .row:hover::before,
      body[data-hover="spring"] .row:focus-visible::before{
        transform:translateY(-50%) scale(var(--sel-bar-x),var(--sel-bar-y)) !important;
      }
    }
  </style>
  <link rel="stylesheet" href="/assets/css/glide.css">
  <!-- hatch.js is deliberately synchronous: pagereveal fires before the first render of the new page, and a deferred script would arrive too late to set it up. -->
  <link rel="stylesheet" href="/assets/css/hatch.css">
  <script src="/assets/js/hatch.js"></script>
  <link rel="expect" href="#foot" blocking="render">
  <!-- render-blocked on the footer: the arriving page is not painted, and its transition does not start, until the document is whole -- so the window opens on a finished page and the band it will close back into already has a rectangle. -->
</head>
<body data-hover="glide" data-hatch="v">
<a class="skip" href="#gallery">Skip to the photos</a>

<div class="bar">
  <div class="bar-inner">
    <a href="/">Federico Salerno</a>
    <span class="bar-here">My dogs</span>
  </div>
</div>

<main class="wrap">
  <header class="head">
    <h1>My dogs</h1>
    <p class="lede">A page for my dogs, and for nothing else. This is Ludovico.</p>
  </header>

  <section class="block" id="ludovico">
    <!-- To add a photo: drop the file in assets/dogs/ (under 200 KB), then add a cell
         <li><img src="/assets/dogs/<name>.jpg" alt="..." width="..." height="..." loading="lazy" decoding="async"></li> -->
    <ul class="gallery" id="gallery">
