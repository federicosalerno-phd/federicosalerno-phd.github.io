<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="google-site-verification" content="MNWCgu7jJLDu3dV_eR-QcmXRab5yPNUmY1I76dgaRys" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My dogs, Federico Salerno</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#111111;
      --panel:#181818;
      --line:#2a2a2a;
      --line-hover:#3d3d3d;
      --text:#ededed;
      --muted:#9a9a9a;

      /* with no hue in the palette the accent is only a light grey: it marks a rule,
         a dot or a number, never a colour */
      --accent:#c4c4c4;
      /* One single soft light grey fill for every band and button, near black ink on it,
         contrast 11.4:1, the same pair as the rows of the home. Not pure white: a white
         slab glares on a dark page, #d4d4d4 sits quietly and still reads as filled. */
      --btn:#d4d4d4;
      --on-btn:#141414;
      --btn-line:rgba(20,20,20,0.10);
      /* the hovered band brightens one step, the ink stays dark, contrast 16.0:1, and the
         press deepens it; one duration drives fill and ink everywhere */
      --btn-sel:#ebebeb;
      --on-btn-sel:#141414;
      --btn-press:#bfbfbf;
      --row-ease:.12s ease;
      --btn-hover:#ebebeb;
      --btn-line-hover:rgba(20,20,20,0.16);

      --ff:'IBM Plex Sans',system-ui,-apple-system,sans-serif;

      --s1:8px; --s2:16px; --s3:24px; --s4:32px;
      --s5:48px; --s6:64px; --s7:96px; --s8:128px;

      /* three type steps only */
      --fs-s:0.8125rem;
      --fs-m:1rem;
      --fs-l:1.375rem;
      /* Rows and buttons carry the main navigation of the site, so their text is never
         smaller than the running body copy: it is the body size itself, 16px. The old
         "one step below body" rule inverted the hierarchy and is gone; the bands are made
         slim by --row-h and by their padding, never by shrinking the type. */
      --fs-btn:1rem;

      /* the section mark: a short tick at the head of a block, the one separator of the
         site. Never a rule across the page. */
      --sep-w:24px;
      --sep-col:#3d3d3d;
      --radius:7px;
      /* bands: minimum height, vertical padding and line height of every row */
      --row-h:36px;
      --row-pad-y:3px;
      --row-lh:1.15;

      --measure:720px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{-webkit-text-size-adjust:100%}
    body{
      background:var(--bg);
      color:var(--text);
      font-family:var(--ff);
      font-size:16px;
      line-height:1.65;
      -webkit-font-smoothing:antialiased;
    }
    a{color:inherit}
    :focus-visible{outline:2px solid var(--text);outline-offset:3px}
    .skip{position:absolute;left:-9999px;top:0}
    .skip:focus{left:var(--s3);top:var(--s3);z-index:5;background:var(--bg);color:var(--text);padding:var(--s1) var(--s2);border-radius:var(--radius);text-decoration:none;outline:2px solid var(--accent)}

    .wrap{width:100%;max-width:var(--measure);margin:0 auto;padding:0 var(--s3)}

    /* the clicked row travels to the top of the page and stays as a slim bar */
    /* the clicked row travels to the top of the page and stays as a slim band */
    .bar{
      position:sticky;top:0;z-index:2;
      background:var(--btn);border-bottom:1px solid var(--btn-line);
      color:var(--on-btn);
    }
    .bar-inner{
      width:100%;max-width:var(--measure);margin:0 auto;
      min-height:var(--row-h);
      padding:var(--row-pad-y) var(--s2);
      display:flex;align-items:center;justify-content:space-between;gap:var(--s2);
      font-size:var(--fs-s);line-height:var(--row-lh);letter-spacing:0.12em;text-transform:uppercase;
    }
    .bar a{color:var(--on-btn);text-decoration:none;border-bottom:1px solid transparent;transition:border-color .18s ease}
    .bar a:hover{border-bottom-color:var(--on-btn)}
    .bar a:focus-visible{outline:2px solid var(--on-btn);outline-offset:3px}
    .bar-here{font-weight:500}

    .head{padding:var(--s7) 0 var(--s6)}
    h1{font-size:var(--fs-l);font-weight:600;letter-spacing:-0.02em;line-height:1.2}
    .lede{margin-top:var(--s2);font-size:var(--fs-m);color:var(--muted);max-width:60ch}

        /* Sections are separated by space and by their own opening type, never by a rule
       across the page: the eyebrow and the title already say a new block has started. */
    .block{padding:var(--s7) 0 0}
    .block:first-of-type{padding-top:var(--s5)}

    /* gallery: two squares per row at 720 px, one under 600 px */
    .gallery{
      list-style:none;
      display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s2);
    }
    .gallery li{
      aspect-ratio:1;overflow:hidden;
      background:var(--panel);border-radius:var(--radius);
    }
    .gallery img{
      display:block;width:100%;height:100%;object-fit:cover;border-radius:var(--radius);
    }

    /* Back is one row of the home index, full width at the foot of the page */
    .back{
      display:flex;align-items:center;justify-content:center;text-align:center;
      width:100%;min-height:var(--row-h);margin-top:var(--s6);
      padding:var(--row-pad-y) var(--s3);
      background:var(--btn);border:1px solid var(--btn-line);border-radius:var(--radius);
      color:var(--on-btn);text-decoration:none;
      font-size:var(--fs-btn);font-weight:500;line-height:var(--row-lh);
      transition:background-color var(--row-ease);
    }
    .back:hover,.back:focus-visible{background:var(--btn-sel)}
    .back:active{background:var(--btn-press)}
    /* hover deepens the fill, so the light ink keeps its contrast */

    /* the canonical section mark, identical on every page: .block, .foot-inner */
    .block::before,.foot-inner::before{
      content:"";display:block;
      width:var(--sep-w);height:1px;background:var(--sep-col);
      margin-bottom:var(--s3);
    }

    .foot{margin-top:var(--s7);padding-bottom:var(--s6)}
    .foot-inner{padding-top:var(--s4)}
    .contacts{
      list-style:none;display:flex;flex-wrap:wrap;gap:var(--s1) var(--s3);
      font-size:var(--fs-s);letter-spacing:0.04em;
    }
    .contacts a{
      color:var(--muted);text-decoration:none;border-bottom:1px solid transparent;padding-bottom:2px;
      transition:color .18s ease,border-color .18s ease;
    }
    .contacts a:hover{color:var(--text);border-bottom-color:var(--accent)}
    .copy{margin-top:var(--s2);font-size:var(--fs-s);color:#808080}

    @media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
    @media (max-width:600px){
      .head{padding:var(--s5) 0 var(--s4)}
      .block{padding:var(--s4) 0}
      .gallery{grid-template-columns:1fr;gap:var(--s1)}
      .back{margin-top:var(--s5)}
      .foot{margin-top:var(--s6)}
      .contacts{gap:var(--s1) var(--s2)}
    }
  </style>
</head>
<body>
<a class="skip" href="#gallery">Skip to the photos</a>

<div class="bar">

  </div>
</div>
