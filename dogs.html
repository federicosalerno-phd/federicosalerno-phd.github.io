    /* My pets only: one block per pet, the photos two by two, one under 600 px. A card

    .grid.pets{grid-template-columns:repeat(2,minmax(0,1fr))}
    @media (max-width:600px){
      .grid.pets{grid-template-columns:minmax(0,1fr)}
    }

<a class="skip" href="#ludovico">Skip to the photos</a>

<header class="titlebar">
  <div class="tbar-brand">
    <a class="tbar-logo-btn" href="/" aria-label="Home"><img class="tbar-logo" src="/assets/icon.svg" alt="" width="22" height="22"></a>
    <span class="tbar-name"><b>Federico Salerno</b><span class="tbar-page">My pets</span></span>

<main class="wrap">
  <header class="head">
    <h1>My pets</h1>
    <p class="lede">A page for my pets, and for nothing else: Ludovico, Abricot and Niki.</p>
  </header>

  <!-- Every photo is the same format: 3:4 portrait, 600×800, under 200 KB, in assets/pets/.
       To add one, crop it to 3:4, save it at 600×800, then add a cell
       <li class="card"><img src="/assets/pets/<name>.jpg" alt="..." width="600" height="800" loading="lazy" decoding="async"></li> -->
  <section class="block" id="ludovico" aria-labelledby="ludovico-title">
    <h2 class="sec-lbl" id="ludovico-title">Ludovico</h2>
    <ul class="grid pets">
      <li class="card"><img src="/assets/pets/ludovico-01.jpg" alt="Ludovico lying on a stone doorstep by a gravel path" width="600" height="800" loading="lazy" decoding="async"></li>
      <li class="card"><img src="/assets/pets/ludovico-02.jpg" alt="Ludovico resting on a bed against blue floral pillows" width="600" height="800" loading="lazy" decoding="async"></li>
      <li class="card"><img src="/assets/pets/ludovico-03.jpg" alt="Ludovico asleep on the stairs" width="600" height="800" loading="lazy" decoding="async"></li>
      <li class="card"><img src="/assets/pets/ludovico-04.jpg" alt="Close up of Ludovico resting his head on a blue floral pillow" width="600" height="800" loading="lazy" decoding="async"></li>
    </ul>
  </section>

  <section class="block" id="abricot" aria-labelledby="abricot-title">
    <h2 class="sec-lbl" id="abricot-title">Abricot</h2>
    <ul class="grid pets">
      <li class="card"><img src="/assets/pets/abricot-01.jpg" alt="Abricot, a black pug, sitting by a potted plant and looking to the side" width="600" height="800" loading="lazy" decoding="async"></li>
      <li class="card"><img src="/assets/pets/abricot-02.jpg" alt="Abricot sitting on the pavement in a leopard print harness and a pearl collar, looking up" width="600" height="800" loading="lazy" decoding="async"></li>
    </ul>
  </section>

  <section class="block" id="niki" aria-labelledby="niki-title">
    <h2 class="sec-lbl" id="niki-title">Niki</h2>
    <ul class="grid pets">
      <li class="card"><img src="/assets/pets/niki-01.jpg" alt="Niki, a rabbit, sitting by a white skirting board on a parquet floor" width="600" height="800" loading="lazy" decoding="async"></li>
      <li class="card"><img src="/assets/pets/niki-02.jpg" alt="Niki sitting up against a white wall, ears raised" width="600" height="800" loading="lazy" decoding="async"></li>
    </ul>
  </section>
